<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TANOCK | Study & Code Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h1 class="logo glow-text">TANOCK<span class="dot">.</span></h1>
            <nav>
                <button class="nav-btn active" onclick="switchTab('dashboard')"><i class="fas fa-chart-pie"></i> Thống Kê</button>
                <button class="nav-btn" onclick="switchTab('timer')"><i class="fas fa-stopwatch"></i> Bấm Giờ Học</button>
                <button class="nav-btn" onclick="switchTab('algorithms')"><i class="fas fa-terminal"></i> Thuật Toán (C++/Python)</button>
                <button class="nav-btn" onclick="switchTab('webdev')"><i class="fas fa-code"></i> Web Builder</button>
            </nav>
            
            <!-- Music Player Mini -->
            <div class="music-player glass-panel">
                <h4><i class="fas fa-headphones"></i> Lo-Fi Focus</h4>
                <audio id="bg-music" loop controls src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3"></audio>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- TAB 1: DASHBOARD (Thống kê) -->
            <section id="dashboard" class="tab-pane active">
                <header><h2>Dữ Liệu Học Tập</h2></header>
                <div class="charts-grid">
                    <div class="chart-container glass-panel"><canvas id="dailyChart"></canvas></div>
                    <div class="chart-container glass-panel"><canvas id="weeklyChart"></canvas></div>
                    <div class="chart-container glass-panel"><canvas id="monthlyChart"></canvas></div>
                    <div class="chart-container glass-panel"><canvas id="subjectPieChart"></canvas></div>
                </div>
            </section>

            <!-- TAB 2: TIMER (Bấm giờ & Môn học) -->
            <section id="timer" class="tab-pane">
                <header><h2>Focus Mode</h2></header>
                <div class="timer-wrapper glass-panel">
                    <div class="subject-selector">
                        <select id="subject-select">
                            <option value="C++ (Thuật toán)">C++ (Thuật toán)</option>
                            <option value="Toán học">Toán học</option>
                            <option value="Tiếng Anh (IELTS)">Tiếng Anh (IELTS)</option>
                            <option value="Hóa học">Hóa học</option>
                        </select>
                        <input type="text" id="new-subject" placeholder="Thêm môn học mới...">
                        <button onclick="addSubject()" class="btn btn-outline"><i class="fas fa-plus"></i></button>
                    </div>
                    
                    <div class="clock-display glow-text" id="time-display">00:00:00</div>
                    
                    <div class="controls">
                        <button onclick="startTimer()" class="btn btn-primary"><i class="fas fa-play"></i> Bắt đầu</button>
                        <button onclick="pauseTimer()" class="btn btn-warning"><i class="fas fa-pause"></i> Tạm dừng</button>
                        <button onclick="stopTimer()" class="btn btn-danger"><i class="fas fa-stop"></i> Kết thúc & Lưu</button>
                    </div>
                </div>
            </section>

            <!-- TAB 3: ALGORITHMS (C++ / Python) -->
            <section id="algorithms" class="tab-pane">
                <header class="editor-header">
                    <h2>Terminal Sandbox</h2>
                    <div class="editor-actions">
                        <select id="lang-select" class="lang-dropdown">
                            <option value="cpp">C++</option>
                            <option value="python">Python</option>
                        </select>
                        <button onclick="downloadCode('algo')" class="btn btn-outline"><i class="fas fa-download"></i> Tải Code</button>
                        <button onclick="runAlgoCode()" class="btn btn-primary"><i class="fas fa-bolt"></i> Run Code</button>
                    </div>
                </header>
                <div class="editor-layout">
                    <div id="algo-editor" class="monaco-container border-glow"></div>
                    <div class="console-output glass-panel">
                        <h3>Output:</h3>
                        <pre id="algo-output">Chờ thực thi lệnh...</pre>
                    </div>
                </div>
            </section>

            <!-- TAB 4: WEB BUILDER (HTML/CSS/JS) -->
            <section id="webdev" class="tab-pane">
                <header class="editor-header">
                    <h2>Web Studio (Live Preview)</h2>
                    <button onclick="downloadWebCode()" class="btn btn-outline"><i class="fas fa-download"></i> Tải Source File</button>
                </header>
                <div class="web-layout">
                    <div class="web-editors">
                        <div class="editor-col">
                            <div class="col-title"><i class="fab fa-html5 text-orange"></i> HTML</div>
                            <div id="html-editor" class="monaco-container"></div>
                        </div>
                        <div class="editor-col">
                            <div class="col-title"><i class="fab fa-css3-alt text-blue"></i> CSS</div>
                            <div id="css-editor" class="monaco-container"></div>
                        </div>
                        <div class="editor-col">
                            <div class="col-title"><i class="fab fa-js text-yellow"></i> JS</div>
                            <div id="js-editor" class="monaco-container"></div>
                        </div>
                    </div>
                    <div class="web-preview glass-panel border-glow">
                        <iframe id="live-preview"></iframe>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Cấu hình Monaco Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
